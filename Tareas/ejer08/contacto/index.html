<main id="contenidos"><section class="col6 contacto-texto"><h1>Contacto</h1><p>Si te interesa alguna pieza de BOP-POP bazar, contáctanos e indica su nombre o número para consultar su disponibilidad.</p></section>
<section class="col6"><form id="contacto"><fieldset><legend>Envíanos un mensaje</legend>
<label for="nombre">Nombre</label><input id="nombre" name="nombre" type="text" autocomplete="name" required>
<label for="correo">Correo electrónico</label><input id="correo" name="correo" type="email" autocomplete="email" required>
<label for="mensaje">Mensaje / Pieza de interés</label><textarea id="mensaje" name="mensaje" required></textarea>
<button type="button" disabled>Enviar mensaje</button><p class="nota-formulario">Formulario de muestra; el envío aún no está habilitado.</p>
</fieldset></form></section><hr class="fila"></main>
